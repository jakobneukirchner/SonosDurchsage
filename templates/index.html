<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONOS Durchsagesystem</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{--bg:#f7f6f2;--surface:#ffffff;--surface2:#f0efeb;--border:#dcd9d5;--text:#28251d;--muted:#7a7974;--primary:#01696f;--primary-h:#0c4e54;--error:#a12c7b;--warn:#964219;--success:#437a22;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#141413;--surface:#1c1b19;--surface2:#232220;--border:#333230;--text:#cdccca;--muted:#797876;--primary:#4f98a3;--primary-h:#227f8b;--error:#d163a7;--warn:#fdab43;--success:#6daa45;--shadow:0 2px 8px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Satoshi',sans-serif;font-size:16px}
body{background:var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-rows:auto 1fr;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.logo svg{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:12px}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:6px 10px;cursor:pointer;font-size:13px}
.theme-btn:hover{border-color:var(--primary);color:var(--primary)}
.main{display:grid;grid-template-columns:280px 1fr 320px;gap:0;height:calc(100vh - 57px);overflow:hidden}
/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-section{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-section h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.speaker-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.speaker-card:hover{border-color:var(--primary)}
.speaker-card.selected{border-color:var(--primary);background:color-mix(in oklab,var(--primary) 8%,var(--surface2))}
.speaker-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.speaker-meta{font-size:12px;color:var(--muted);margin-top:2px}
.speaker-state{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.speaker-state.playing{background:var(--success);box-shadow:0 0 6px var(--success)}
.speaker-state.paused{background:var(--warn)}
.volume-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.volume-row input[type=range]{flex:1;accent-color:var(--primary);height:4px}
.volume-val{font-size:11px;color:var(--muted);width:28px;text-align:right}
.select-all-btn{font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;padding:2px 0}
/* Gong selector */
.gong-row{display:flex;gap:6px;flex-wrap:wrap}
.gong-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s}
.gong-chip:hover,.gong-chip.selected{border-color:var(--primary);color:var(--primary);background:color-mix(in oklab,var(--primary) 8%,var(--surface2))}
.gong-chip.none-chip{color:var(--muted)}
/* Center */
.center{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px}
.tab{padding:12px 16px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{flex:1;overflow-y:auto;padding:16px;display:none}
.tab-content.active{display:block}
/* Schnelldurchsagen */
.folder-group{margin-bottom:20px}
.folder-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.folder-label svg{opacity:.5}
.audio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.audio-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:8px}
.audio-btn:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.audio-btn .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio-btn .size{font-size:11px;color:var(--muted)}
/* Aufnahme */
.record-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;max-width:400px;margin:0 auto}
.record-btn{width:80px;height:80px;border-radius:50%;border:3px solid var(--error);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;transition:all .2s}
.record-btn.recording{background:var(--error);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--error) 50%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.record-btn svg{color:var(--error)}
.record-btn.recording svg{color:#fff}
.rec-time{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);margin-bottom:8px}
.rec-status{font-size:13px;color:var(--muted)}
/* Recordings Liste */
.rec-list{margin-top:20px}
.rec-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rec-item .ri-name{flex:1;font-size:13px;font-weight:500}
.rec-item .ri-time{font-size:11px;color:var(--muted)}
.play-rec-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--primary)}
.play-rec-btn:hover{border-color:var(--primary)}
/* Rechte Spalte: Status */
.status-panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.status-panel h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px;border-bottom:1px solid var(--border)}
.status-section{padding:12px 16px;border-bottom:1px solid var(--border)}
.status-section h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.info-row .label{color:var(--muted)}
.info-row .value{font-family:monospace;font-size:11px;color:var(--primary);word-break:break-all;text-align:right;max-width:180px}
.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:600}
.badge.ok{background:color-mix(in oklab,var(--success) 15%,transparent);color:var(--success)}
.badge.err{background:color-mix(in oklab,var(--error) 15%,transparent);color:var(--error)}
.badge.warn{background:color-mix(in oklab,var(--warn) 15%,transparent);color:var(--warn)}
.log-area{flex:1;overflow-y:auto;padding:8px 12px}
.log-entry{font-size:11px;font-family:monospace;padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:6px}
.log-entry .lt{color:var(--muted);flex-shrink:0}
.log-entry .lm{word-break:break-all}
.log-entry.error .lm{color:var(--error)}
.log-entry.info .lm{color:var(--text)}
.log-entry.warn .lm{color:var(--warn)}
/* Buttons */
.btn{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary)}
.diag-btn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--primary);cursor:pointer;margin-top:4px}
.diag-btn:hover{background:color-mix(in oklab,var(--primary) 8%,transparent)}
.diag-result{font-size:11px;margin-top:6px}
.diag-ok{color:var(--success)}
.diag-err{color:var(--error)}
/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;font-size:13px;box-shadow:var(--shadow);display:none;z-index:999;max-width:320px}
#toast.show{display:block}
#toast.ok{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--error);color:var(--error)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:32px;}
@media(max-width:900px){.main{grid-template-columns:1fr}.status-panel,.sidebar{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    SONOS Durchsage
  </div>
  <div class="header-right">
    <button class="theme-btn" onclick="toggleTheme()">☀️ Hell</button>
    <button class="diag-btn" onclick="runDiagnose()">🔍 Diagnose</button>
  </div>
</header>

<div class="main">
  <!-- Sidebar: Lautsprecher + Gong -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Lautsprecher
        <button class="select-all-btn" onclick="selectAll()" style="float:right">Alle</button>
      </h3>
      <div id="speaker-list"><div class="empty">Suche...</div></div>
      <button class="btn btn-ghost" onclick="loadSpeakers()" style="width:100%;margin-top:8px;font-size:12px">🔄 Neu scannen</button>
    </div>
    <div class="sidebar-section">
      <h3>Gong</h3>
      <div class="gong-row" id="gong-list">
        <span class="gong-chip none-chip selected" data-gong="" onclick="selectGong(this)">Kein Gong</span>
      </div>
    </div>
    <div class="sidebar-section" style="flex:1">
      <h3>Lautstärke</h3>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="global-vol" min="0" max="100" value="40" style="flex:1;accent-color:var(--primary)" oninput="document.getElementById('vol-val').textContent=this.value">
        <span id="vol-val" style="font-size:13px;font-weight:600;color:var(--primary);width:28px">40</span>
      </div>
    </div>
  </div>

  <!-- Center: Tabs -->
  <div class="center">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('schnell',this)">⚡ Schnelldurchsagen</div>
      <div class="tab" onclick="switchTab('aufnahme',this)">🎙 Aufnahme</div>
      <div class="tab" onclick="switchTab('recordings',this)">📂 Gespeichert</div>
    </div>

    <!-- Schnelldurchsagen -->
    <div class="tab-content active" id="tab-schnell">
      <div id="schnell-container"><div class="empty">Lade...</div></div>
    </div>

    <!-- Aufnahme -->
    <div class="tab-content" id="tab-aufnahme">
      <div class="record-panel">
        <div class="rec-time" id="rec-time">00:00</div>
        <button class="record-btn" id="rec-btn" onclick="toggleRecord()">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="8"/>
          </svg>
        </button>
        <div class="rec-status" id="rec-status">Klicken zum Aufnehmen</div>
        <div id="last-recording" style="margin-top:16px"></div>
      </div>
    </div>

    <!-- Gespeicherte Aufnahmen -->
    <div class="tab-content" id="tab-recordings">
      <div id="rec-list-container"><div class="empty">Keine Aufnahmen</div></div>
    </div>
  </div>

  <!-- Status Panel rechts -->
  <div class="status-panel">
    <h3>🟢 Echtzeit-Status</h3>
    <div class="status-section">
      <h4>Datei-Server (für SONOS)</h4>
      <div class="info-row"><span class="label">URL</span><span class="value" id="s-fileurl">–</span></div>
      <div class="info-row"><span class="label">Status</span><span id="s-svstate"><span class="badge warn">–</span></span></div>
    </div>
    <div class="status-section">
      <h4>Lautsprecher Live</h4>
      <div id="s-speakers"><div style="font-size:12px;color:var(--muted)">Lade...</div></div>
    </div>
    <div class="status-section">
      <h4>Diagnose</h4>
      <button class="diag-btn" onclick="runDiagnose()">Jetzt prüfen</button>
      <div id="diag-results" class="diag-result"></div>
    </div>
    <h3 style="margin-top:0">📋 Log</h3>
    <div class="log-area" id="log-area"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const state = { speakers: [], selectedSpeakers: new Set(), selectedGong: '', recording: false, recStart: null, recTimer: null };

// ── Theme ────────────────────────────────────────────────────────────────────
function toggleTheme(){
  const h = document.documentElement;
  const t = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', t);
  document.querySelector('.theme-btn').textContent = t === 'dark' ? '☀️ Hell' : '🌙 Dunkel';
}

// ── Tab-Switching ─────────────────────────────────────────────────────────────
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if(name === 'recordings') loadRecordings();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type='ok'){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3500);
}

// ── Lautsprecher laden ────────────────────────────────────────────────────────
async function loadSpeakers(){
  document.getElementById('speaker-list').innerHTML = '<div class="empty">Suche im Netzwerk...</div>';
  try {
    const r = await fetch('/api/speakers');
    const d = await r.json();
    state.speakers = d.speakers;
    renderSpeakers();
  } catch(e){ toast('Fehler beim Laden der Lautsprecher','err'); }
}

function renderSpeakers(){
  const el = document.getElementById('speaker-list');
  if(!state.speakers.length){ el.innerHTML = '<div class="empty">Keine SONOS-Geräte gefunden</div>'; return; }
  el.innerHTML = state.speakers.map(s => `
    <div class="speaker-card ${state.selectedSpeakers.has(s.uid)?'selected':''}" onclick="toggleSpeaker('${s.uid}')" id="sc-${s.uid}">
      <div class="speaker-name">
        <span class="speaker-state ${stateClass(s.state)}"></span>
        ${s.name}
      </div>
      <div class="speaker-meta">${s.model} · ${s.ip}</div>
      <div class="volume-row">
        <input type="range" min="0" max="100" value="${s.volume}" oninput="setVolume('${s.uid}',this.value);document.getElementById('vv-${s.uid}').textContent=this.value" onclick="event.stopPropagation()">
        <span class="volume-val" id="vv-${s.uid}">${s.volume}</span>
      </div>
    </div>`).join('');
}

function stateClass(st){ return st==='PLAYING'?'playing':st==='PAUSED_PLAYBACK'?'paused':''; }

function toggleSpeaker(uid){
  if(state.selectedSpeakers.has(uid)) state.selectedSpeakers.delete(uid);
  else state.selectedSpeakers.add(uid);
  renderSpeakers();
}

function selectAll(){
  state.speakers.forEach(s => state.selectedSpeakers.add(s.uid));
  renderSpeakers();
}

async function setVolume(uid, val){
  await fetch(`/api/speakers/${uid}/volume`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({volume:+val})});
}

// ── Gong ──────────────────────────────────────────────────────────────────────
async function loadGongs(){
  const r = await fetch('/api/gongs');
  const d = await r.json();
  const el = document.getElementById('gong-list');
  el.innerHTML = '<span class="gong-chip none-chip selected" data-gong="" onclick="selectGong(this)">Kein Gong</span>';
  d.gongs.forEach(g => {
    const c = document.createElement('span');
    c.className = 'gong-chip'; c.dataset.gong = g.filename;
    c.textContent = g.name; c.onclick = () => selectGong(c);
    el.appendChild(c);
  });
}

function selectGong(el){
  document.querySelectorAll('.gong-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state.selectedGong = el.dataset.gong;
}

// ── Schnelldurchsagen laden ───────────────────────────────────────────────────
async function loadSchnell(){
  const r = await fetch('/api/schnelldurchsagen');
  const d = await r.json();
  const el = document.getElementById('schnell-container');
  if(!d.folders.length){ el.innerHTML = '<div class="empty">Keine Audiodateien in schnelldurchsagen/</div>'; return; }
  el.innerHTML = d.folders.map(f => `
    <div class="folder-group">
      <div class="folder-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6H12l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
        ${f.folder}
      </div>
      <div class="audio-grid">${f.files.map(fi => `
        <button class="audio-btn" onclick="playFile('${f.folder}/${fi.filename}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <div><div class="name">${fi.name}</div><div class="size">${(fi.size/1024).toFixed(0)} KB</div></div>
        </button>`).join('')}
      </div>
    </div>`).join('');
}

// ── Datei abspielen ───────────────────────────────────────────────────────────
async function playFile(path){
  if(!state.selectedSpeakers.size){ toast('Bitte zuerst einen Lautsprecher auswählen!','err'); return; }
  const vol = document.getElementById('global-vol').value;
  toast('Sende Durchsage...', 'ok');
  try {
    const r = await fetch('/api/play', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        speakers: [...state.selectedSpeakers],
        path: path,
        volume: +vol,
        gong: state.selectedGong || null
      })
    });
    const d = await r.json();
    if(d.success){
      const ok = d.results?.filter(x=>x.success).map(x=>x.speaker).join(', ');
      toast('✓ Spielt auf: ' + (ok || 'Lautsprecher'), 'ok');
    } else {
      toast('Fehler: ' + d.error, 'err');
    }
    updateLog();
  } catch(e){ toast('Netzwerkfehler: '+e, 'err'); }
}

// ── Aufnahme ──────────────────────────────────────────────────────────────────
async function toggleRecord(){
  if(!state.recording){
    const r = await fetch('/api/record/start', {method:'POST'});
    const d = await r.json();
    if(!d.success){ toast('Fehler: '+d.error,'err'); return; }
    state.recording = true;
    state.recStart = Date.now();
    document.getElementById('rec-btn').classList.add('recording');
    document.getElementById('rec-status').textContent = 'Aufnahme läuft...';
    state.recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-state.recStart)/1000);
      document.getElementById('rec-time').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }, 500);
  } else {
    clearInterval(state.recTimer);
    state.recording = false;
    document.getElementById('rec-btn').classList.remove('recording');
    document.getElementById('rec-status').textContent = 'Speichere...';
    const r = await fetch('/api/record/stop', {method:'POST'});
    const d = await r.json();
    if(d.success){
      document.getElementById('rec-status').textContent = `Gespeichert: ${d.filename} (${d.duration.toFixed(1)}s)`;
      document.getElementById('last-recording').innerHTML = `
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <audio controls src="/audio/recordings/${d.filename}" style="height:32px"></audio>
          <button class="btn btn-primary" style="font-size:12px" onclick="playFileByPath('${d.path}')">▶ Auf SONOS</button>
        </div>`;
    } else {
      document.getElementById('rec-status').textContent = 'Fehler: ' + d.error;
    }
  }
}

async function playFileByPath(path){
  if(!state.selectedSpeakers.size){ toast('Bitte Lautsprecher wählen!','err'); return; }
  const vol = document.getElementById('global-vol').value;
  const r = await fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({speakers:[...state.selectedSpeakers], path, volume:+vol, gong: state.selectedGong||null})});
  const d = await r.json();
  toast(d.success ? '✓ Spielt auf SONOS' : 'Fehler: '+d.error, d.success?'ok':'err');
  updateLog();
}

// ── Gespeicherte Aufnahmen ────────────────────────────────────────────────────
async function loadRecordings(){
  const r = await fetch('/api/recordings');
  const d = await r.json();
  const el = document.getElementById('rec-list-container');
  if(!d.recordings.length){ el.innerHTML = '<div class="empty">Keine Aufnahmen vorhanden</div>'; return; }
  el.innerHTML = '<div class="rec-list">'+ d.recordings.map(rec=>`
    <div class="rec-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color:var(--muted)"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <div class="ri-name">${rec.name}</div>
      <audio controls src="/audio/recordings/${rec.filename}" style="height:28px"></audio>
      <button class="play-rec-btn" onclick="playFileByPath('${rec.path}')">▶ SONOS</button>
    </div>`).join('') +'</div>';
}

// ── Echtzeit-Status ───────────────────────────────────────────────────────────
async function updateStatus(){
  try {
    const r = await fetch('/api/status');
    const d = await r.json();

    document.getElementById('s-fileurl').textContent = d.fileserver;
    document.getElementById('s-svstate').innerHTML = `<span class="badge ok">✓ Läuft</span>`;

    // Live-Lautsprecher
    const sel = document.getElementById('s-speakers');
    if(d.speakers.length){
      sel.innerHTML = d.speakers.map(s=>`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px">
          <span><span class="speaker-state ${stateClass(s.state)}"></span> <b>${s.name}</b></span>
          <span style="color:var(--muted)">${stateLabel(s.state)}</span>
        </div>
        ${s.track ? `<div style="font-size:11px;color:var(--primary);margin-bottom:4px;padding-left:14px">▶ ${s.track}</div>` : ''}`).join('');
    } else {
      sel.innerHTML = '<div style="font-size:12px;color:var(--muted)">Keine Lautsprecher</div>';
    }

    updateLog(d.log);
  } catch(e){}
}

function stateLabel(s){
  return {PLAYING:'▶ Spielt',PAUSED_PLAYBACK:'⏸ Pause',STOPPED:'⏹ Gestoppt'}[s] || s||'–';
}

function updateLog(entries){
  if(!entries) return;
  const el = document.getElementById('log-area');
  el.innerHTML = [...entries].reverse().map(e=>`
    <div class="log-entry ${e.level}">
      <span class="lt">${e.time}</span>
      <span class="lm">${e.msg}</span>
    </div>`).join('');
}

// ── Diagnose ──────────────────────────────────────────────────────────────────
async function runDiagnose(){
  const el = document.getElementById('diag-results');
  el.textContent = 'Prüfe...';
  const r = await fetch('/api/diagnose');
  const d = await r.json();
  el.innerHTML = d.results.map(x=>`
    <div class="${x.ok?'diag-ok':'diag-err'}" style="margin-bottom:4px">
      ${x.ok?'✓':'✗'} ${x.test}<br>
      <span style="opacity:.7;font-size:10px">${x.detail}</span>
    </div>`).join('');
}

// ── Init ─────────────────────────────────────────────────────────────────────
loadSpeakers();
loadGongs();
loadSchnell();
updateStatus();
setInterval(updateStatus, 4000);
</script>
