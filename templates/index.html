<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durchsageanlage</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   LOK-HMI STYLE  (Bombardier / Siemens Fahrzeugfuehrer-Display)
   Dunkelblauer Hintergrund, hellblaue Schaltflaechen, weisse Schrift
==================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  background:#000;
  font-family:'Noto Sans',Arial,sans-serif;
  font-size:16px;
  color:#fff;
  overflow:hidden;
  user-select:none;
}
/* ---------- Gesamtrahmen (simuliert Displayrahmen) ---------- */
.frame{
  width:100vw;height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  background: #0a1628;
}
/* ---------- Titelleiste ---------- */
.titlebar{
  background: #0a1628;
  border-bottom:2px solid #2a5298;
  padding:6px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:44px;
}
.titlebar-left{font-size:14px;color:#cde;font-weight:400;white-space:nowrap}
.titlebar-center{
  font-size:20px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:center;
  flex:1;
}
.titlebar-right{
  font-size:14px;
  color:#cde;
  font-family:'Noto Sans',monospace;
  white-space:nowrap;
  text-align:right;
}
/* ---------- Hauptbereich ---------- */
.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  overflow:hidden;
}
.panel{
  padding:12px 16px;
  border-right:1px solid #1e3a6a;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panel:last-child{border-right:none}
/* ---------- Panel-Ueberschrift ---------- */
.p-head{
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#8ab;
  border-bottom:1px solid #1e3a6a;
  padding-bottom:6px;
  margin-bottom:2px;
}
/* ---------- HMI-Schaltflaeche (Lok-Stil) ---------- */
.hbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background: linear-gradient(180deg, #4a7fd4 0%, #2a5298 60%, #1e3f7a 100%);
  border: 1px solid #6fa0e8;
  border-bottom-color: #1a3060;
  border-radius:6px;
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  padding:9px 18px;
  cursor:pointer;
  text-align:center;
  transition:filter .08s;
  white-space:nowrap;
  box-shadow: 0 2px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
}
.hbtn:hover{filter:brightness(1.15)}
.hbtn:active{
  filter:brightness(.85);
  transform:translateY(1px);
  box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(0,0,0,.1);
}
.hbtn.active{
  background:linear-gradient(180deg,#70b040 0%,#4a8020 60%,#306010 100%);
  border-color:#90d060;
  border-bottom-color:#204010;
  box-shadow:0 0 8px rgba(100,200,50,.4), 0 2px 4px rgba(0,0,0,.5);
}
.hbtn.danger{
  background:linear-gradient(180deg,#d44a4a 0%,#982a2a 60%,#7a1e1e 100%);
  border-color:#e87070;
  border-bottom-color:#601818;
}
.hbtn.danger:hover{filter:brightness(1.1)}
.hbtn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.hbtn-full{width:100%;font-size:16px;padding:12px 18px}
/* ---------- Tabelle Aktuell/Soll (Lok-Stil) ---------- */
.tbl{
  width:100%;
  border-collapse:separate;
  border-spacing:0 4px;
}
.tbl td{
  padding:6px 10px;
  font-size:14px;
  vertical-align:middle;
}
.tbl td:first-child{
  font-weight:700;
  color:#cde;
  width:50%;
}
.tbl .val{
  background:linear-gradient(180deg,#4a7fd4 0%,#2a5298 70%,#1e3f7a 100%);
  border:1px solid #6fa0e8;
  border-radius:5px;
  text-align:center;
  font-weight:700;
  font-size:13px;
  padding:5px 8px;
  min-width:80px;
  cursor:pointer;
  transition:filter .08s;
}
.tbl .val:hover{filter:brightness(1.15)}
.tbl .val.sel{
  background:linear-gradient(180deg,#70b040 0%,#4a8020 70%,#306010 100%);
  border-color:#90d060;
  box-shadow:0 0 6px rgba(100,200,50,.35);
}
/* ---------- Lautstarkeregler ---------- */
.vol-wrap{display:flex;align-items:center;gap:10px}
.vol-label{color:#8ab;font-size:13px;width:110px;flex-shrink:0}
.vol-num{
  background:linear-gradient(180deg,#4a7fd4 0%,#2a5298 70%,#1e3f7a 100%);
  border:1px solid #6fa0e8;
  border-radius:5px;
  font-weight:700;
  font-size:13px;
  padding:4px 10px;
  min-width:54px;
  text-align:center;
}
input[type=range]{
  flex:1;
  accent-color:#6fa0e8;
  height:6px;
  cursor:pointer;
}
/* ---------- Dateiliste (Lok-Tabellenzeilen) ---------- */
.flist{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.frow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(30,60,120,.35);
  border:1px solid #1e3a6a;
  border-radius:4px;
  padding:6px 10px;
  cursor:pointer;
  font-size:13px;
  gap:8px;
  transition:background .08s, border-color .08s;
}
.frow:hover{background:rgba(74,127,212,.25);border-color:#4a7fd4}
.frow.active{
  background:linear-gradient(90deg,rgba(70,160,40,.3),rgba(30,120,20,.2));
  border-color:#90d060;
  color:#b0f060;
  font-weight:700;
}
.frow-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow-meta{font-size:11px;color:#8ab;flex-shrink:0}
.folder-head{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#8ab;
  padding:5px 4px 3px;
}
/* ---------- Aufnahme-Button ---------- */
.rec-circle{
  width:60px;height:60px;
  border-radius:50%;
  background:linear-gradient(180deg,#d44a4a 0%,#982a2a 60%,#7a1e1e 100%);
  border:2px solid #e87070;
  box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:26px;
  transition:filter .1s;
  margin:auto;
}
.rec-circle:hover{filter:brightness(1.15)}
.rec-circle:active{filter:brightness(.8)}
.rec-circle.recording{
  animation:rec-pulse 1s ease-in-out infinite;
  box-shadow:0 0 18px rgba(220,60,60,.7),0 2px 6px rgba(0,0,0,.5);
}
@keyframes rec-pulse{
  0%,100%{box-shadow:0 0 8px rgba(220,60,60,.5),0 2px 4px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 22px rgba(255,80,80,.9),0 2px 4px rgba(0,0,0,.5)}
}
.rec-label{text-align:center;font-size:12px;color:#8ab;margin-top:4px;letter-spacing:.06em}
.rec-label.active{color:#f87070;font-weight:700}
/* ---------- Statuszeile ---------- */
.statusline{
  background:#0a1628;
  border-top:2px solid #2a5298;
  padding:6px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:36px;
}
.status-dot{
  width:10px;height:10px;
  border-radius:50%;
  background:#333;
  flex-shrink:0;
}
.status-dot.green{background:#50d050;box-shadow:0 0 6px #50d050}
.status-dot.red{background:#f05050;box-shadow:0 0 6px #f05050}
.status-dot.amber{background:#d0a020;box-shadow:0 0 6px #d0a020}
.status-dot.blue{background:#50a0f0;box-shadow:0 0 6px #50a0f0}
.status-text{font-size:13px;font-weight:700;letter-spacing:.04em;flex:1}
.status-right{font-size:12px;color:#8ab;font-family:'Noto Sans',monospace}
/* ---------- Dropdown ---------- */
select{
  width:100%;
  padding:7px 10px;
  background:linear-gradient(180deg,#4a7fd4 0%,#2a5298 70%,#1e3f7a 100%);
  border:1px solid #6fa0e8;
  border-radius:5px;
  color:#fff;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
  outline:none;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}
select option{background:#1e3a6a;color:#fff}
/* ---------- Input ---------- */
input[type=text]{
  width:100%;
  padding:8px 10px;
  background:rgba(30,60,120,.5);
  border:1px solid #2a5298;
  border-radius:5px;
  color:#fff;
  font-size:13px;
  font-family:inherit;
  outline:none;
}
input[type=text]:focus{border-color:#6fa0e8;background:rgba(30,60,140,.7)}
/* ---------- Notizmeldung ---------- */
.note{
  font-size:12px;
  color:#8ab;
  line-height:1.6;
  padding:6px 10px;
  background:rgba(10,22,60,.5);
  border-left:3px solid #2a5298;
}
/* ---------- Scroll ---------- */
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-track{background:#0a1628}
.panel::-webkit-scrollbar-thumb{background:#2a5298;border-radius:3px}
/* ---------- responsive ---------- */
@media(max-width:760px){
  .main{grid-template-columns:1fr;overflow:visible}
  .frame{overflow-y:auto}
  body{overflow:auto}
  .panel{border-right:none;border-bottom:1px solid #1e3a6a}
}
</style>
</head>
<body>
<div class="frame">

<!-- ========== TITELLEISTE ========== -->
<header class="titlebar">
  <div class="titlebar-left" id="tl-date"></div>
  <div class="titlebar-center">DURCHSAGEANLAGE</div>
  <div class="titlebar-right" id="tl-time"></div>
</header>

<!-- ========== HAUPTBEREICH ========== -->
<div class="main">

  <!-- LINKES PANEL -->
  <div class="panel">

    <!-- Lautsprecher -->
    <div class="p-head">Lautsprecher</div>
    <div class="hbtn-row">
      <button class="hbtn" id="btnDiscover" onclick="discoverSpeakers()">&#128269; Suchen</button>
      <button class="hbtn danger" onclick="stopAll()">&#9209; Stop</button>
    </div>
    <div id="spList"><div style="font-size:13px;color:#8ab;padding:4px 0">Lautsprecher suchen…</div></div>

    <!-- Lautstaerke -->
    <div class="p-head" style="margin-top:6px">Lautst&auml;rke</div>
    <div class="vol-wrap">
      <span class="vol-label">Durchsage</span>
      <input type="range" min="1" max="100" value="25" id="volRange"
             oninput="document.getElementById('volNum').textContent=this.value+'%'">
      <span class="vol-num" id="volNum">25%</span>
    </div>

    <!-- Gong -->
    <div class="p-head" style="margin-top:6px">Gong</div>
    <select id="gongSel"><option value="">— Kein Gong —</option></select>

    <!-- Aufnahme -->
    <div class="p-head" style="margin-top:6px">Mikrofonaufnahme</div>
    <div>
      <div class="rec-circle" id="recBtn" onclick="toggleRec()">&#9210;</div>
      <div class="rec-label" id="recLabel">BEREIT</div>
    </div>
    <div class="note">
      Aufnehmen &rarr; automatisch auf ausgew&auml;hlten SONOS abspielen.<br>
      SONOS unterst&uuml;tzt keine direkte Einspeisung.
    </div>

    <!-- Neuen Ordner anlegen -->
    <div class="p-head" style="margin-top:6px">Ordner anlegen</div>
    <input type="text" id="newFolder" placeholder="Ordnername">
    <button class="hbtn" style="margin-top:4px" onclick="createFolder()">Ordner erstellen</button>

  </div><!-- /links -->

  <!-- RECHTES PANEL -->
  <div class="panel">

    <!-- Schnelldurchsagen -->
    <div class="p-head">
      Schnelldurchsagen
      <button class="hbtn" style="padding:3px 10px;font-size:12px;float:right" onclick="loadQuick()">&#8635;</button>
    </div>
    <div id="quickTree"><div style="font-size:13px;color:#8ab">Lade…</div></div>

    <!-- Aufnahmen -->
    <div class="p-head" style="margin-top:6px">
      Aufnahmen
      <button class="hbtn" style="padding:3px 10px;font-size:12px;float:right" onclick="loadRecs()">&#8635;</button>
    </div>
    <div id="recList"><div style="font-size:13px;color:#8ab">Keine Aufnahmen.</div></div>

    <!-- Abspielen -->
    <div style="margin-top:auto;padding-top:12px">
      <button class="hbtn hbtn-full" onclick="playSelected()">
        &#9654;&nbsp; DURCHSAGE STARTEN
      </button>
    </div>

  </div><!-- /rechts -->

</div><!-- /.main -->

<!-- ========== STATUSZEILE ========== -->
<footer class="statusline">
  <div class="status-dot" id="sDot"></div>
  <div class="status-text" id="sTxt">BEREIT</div>
  <div class="status-right" id="sRight"></div>
</footer>

</div><!-- /.frame -->

<script>
'use strict';

let selPath    = '';
let selSpeakers = new Set();
let isRecording = false;

// Uhr
function updateClock(){
  const now  = new Date();
  const pad  = n => String(n).padStart(2,'0');
  const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  document.getElementById('tl-date').textContent =
    days[now.getDay()]+', '+pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+String(now.getFullYear()).slice(-2);
  document.getElementById('tl-time').textContent =
    pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
}
setInterval(updateClock,1000);
updateClock();

// API
async function api(url, opts={}){
  try{
    const r = await fetch(url,{headers:{'Content-Type':'application/json'},...opts});
    return await r.json();
  }catch(e){
    return {success:false,error:e.message};
  }
}

// Status
function setStatus(msg, type=''){
  const dot  = document.getElementById('sDot');
  const txt  = document.getElementById('sTxt');
  const map  = {ok:'green',err:'red',warn:'amber',info:'blue','':''};
  dot.className = 'status-dot '+(map[type]||'');
  txt.textContent = msg;
}

// Systemstatus laden
async function loadSysStatus(){
  const d = await api('/api/status');
  document.getElementById('sRight').textContent =
    `${d.ip}:${d.port||5000}  |  SOCO: ${d.soco?'OK':'FEHLT'}  |  AUDIO: ${d.audio?'OK':'FEHLT'}`;
}

// ---- Lautsprecher ----
function renderSpeakers(list){
  const el = document.getElementById('spList');
  if(!list||!list.length){
    el.innerHTML='<div style="font-size:13px;color:#8ab">Keine SONOS-Geräte gefunden.</div>';
    return;
  }
  el.innerHTML='';
  // Tabelle wie im Lok-HMI
  const tbl = document.createElement('table');
  tbl.className='tbl';
  list.forEach(s=>{
    const tr = document.createElement('tr');
    const sel = selSpeakers.has(s.ip);
    tr.innerHTML=`
      <td style="font-weight:700;color:#fff">${s.name}<br><span style="font-size:11px;color:#8ab;font-weight:400">${s.ip}</span></td>
      <td><div class="val${sel?' sel':''}" data-ip="${s.ip}" onclick="toggleSp('${s.ip}',this)">${sel?'EIN':'AUS'}</div></td>
      <td><div class="val" style="cursor:default">${s.volume}%</div></td>`;
    tbl.appendChild(tr);
  });
  el.appendChild(tbl);
}

function toggleSp(ip, el){
  if(selSpeakers.has(ip)){
    selSpeakers.delete(ip);
    el.classList.remove('sel');
    el.textContent='AUS';
  }else{
    selSpeakers.add(ip);
    el.classList.add('sel');
    el.textContent='EIN';
  }
}

async function discoverSpeakers(){
  const btn=document.getElementById('btnDiscover');
  btn.textContent='…';
  setStatus('Suche SONOS…','info');
  const d=await api('/api/speakers/discover',{method:'POST',body:'{}'});
  renderSpeakers(d.speakers||[]);
  setStatus((d.speakers||[]).length?`${d.speakers.length} Lautsprecher gefunden`:'Keine Geräte gefunden',
            (d.speakers||[]).length?'ok':'warn');
  btn.textContent='&#128269; Suchen';
  btn.innerHTML='&#128269; Suchen';
}

// ---- Gong ----
async function loadGongs(){
  const d=await api('/api/gongs');
  const sel=document.getElementById('gongSel');
  sel.innerHTML='<option value="">— Kein Gong —</option>';
  (d.gongs||[]).forEach(g=>{
    const o=document.createElement('option');
    o.value=g.path;o.textContent=g.name;sel.appendChild(o);
  });
}

// ---- Dateibaum ----
function makeRow(file){
  const div=document.createElement('div');
  div.className='frow'+(selPath===file.path?' active':'');
  div.innerHTML=`<span class="frow-name">${file.name}</span><span class="frow-meta">${(file.size/1024).toFixed(0)} KB</span>`;
  div.addEventListener('click',()=>{
    selPath=file.path;
    document.querySelectorAll('.frow').forEach(e=>e.classList.remove('active'));
    div.classList.add('active');
    setStatus('BEREIT: '+file.name,'info');
  });
  return div;
}

function renderNode(node, cont, isRoot){
  if(!isRoot&&node.name){
    const h=document.createElement('div');
    h.className='folder-head';
    h.innerHTML=`&#128193;&nbsp;${node.name}`;
    cont.appendChild(h);
  }
  const wrap=document.createElement('div');
  wrap.className='flist';
  if(!isRoot){wrap.style.paddingLeft='10px'}
  (node.files||[]).forEach(f=>wrap.appendChild(makeRow(f)));
  (node.folders||[]).forEach(f=>renderNode(f,wrap,false));
  cont.appendChild(wrap);
}

async function loadQuick(){
  const d=await api('/api/schnelldurchsagen');
  const c=document.getElementById('quickTree');c.innerHTML='';
  const any=n=>((n.files||[]).length>0||(n.folders||[]).some(any));
  if(!any(d)){c.innerHTML='<div style="font-size:13px;color:#8ab">Keine Audiodateien.</div>';return;}
  renderNode(d,c,true);
}

async function loadRecs(){
  const d=await api('/api/recordings');
  const el=document.getElementById('recList');
  const recs=d.recordings||[];
  if(!recs.length){el.innerHTML='<div style="font-size:13px;color:#8ab">Keine Aufnahmen.</div>';return;}
  el.innerHTML='';
  const wrap=document.createElement('div');wrap.className='flist';
  recs.forEach(r=>{
    const div=document.createElement('div');
    div.className='frow'+(selPath===r.path?' active':'');
    div.innerHTML=`<span class="frow-name">${r.name}</span><span class="frow-meta">${(r.size/1024).toFixed(0)} KB</span>`;
    div.addEventListener('click',()=>{
      selPath=r.path;
      document.querySelectorAll('.frow').forEach(e=>e.classList.remove('active'));
      div.classList.add('active');
      setStatus('BEREIT: '+r.name,'info');
    });
    wrap.appendChild(div);
  });
  el.appendChild(wrap);
}

// ---- Aufnahme ----
async function toggleRec(){
  const btn=document.getElementById('recBtn');
  const lbl=document.getElementById('recLabel');
  if(!isRecording){
    const d=await api('/api/record/start',{method:'POST',body:'{}'});
    if(d.success){
      isRecording=true;
      btn.classList.add('recording');
      btn.innerHTML='&#9209;';
      lbl.textContent='REC ●';
      lbl.classList.add('active');
      setStatus('Aufnahme läuft…','warn');
    }else setStatus('Aufnahme: '+(d.error||'Fehler'),'err');
  }else{
    const d=await api('/api/record/stop',{method:'POST',body:'{}'});
    isRecording=false;
    btn.classList.remove('recording');
    btn.innerHTML='&#9210;';
    lbl.textContent='BEREIT';
    lbl.classList.remove('active');
    if(d.success){
      setStatus('Gespeichert: '+d.filename,'ok');
      await loadRecs();
      if(selSpeakers.size&&d.path){selPath=d.path;await playSelected();}
    }else setStatus('Speicherfehler: '+(d.error||''),'err');
  }
}

// ---- Abspielen ----
async function playSelected(){
  if(!selPath){setStatus('Keine Datei ausgewählt','err');return;}
  if(!selSpeakers.size){setStatus('Keinen Lautsprecher ausgewählt','err');return;}
  setStatus('Sende Durchsage…','info');
  const d=await api('/api/play',{
    method:'POST',
    body:JSON.stringify({
      audio_path: selPath,
      gong_path:  document.getElementById('gongSel').value,
      speakers:   Array.from(selSpeakers),
      volume:     parseInt(document.getElementById('volRange').value,10)
    })
  });
  if(d.success)setStatus('DURCHSAGE AKTIV  ►  '+selPath.split('/').pop(),'ok');
  else setStatus('FEHLER: '+(d.error||'unbekannt'),'err');
}

async function stopAll(){
  const d=await api('/api/stop',{
    method:'POST',
    body:JSON.stringify({speakers:Array.from(selSpeakers)})
  });
  setStatus(d.success?'Wiedergabe gestoppt':'Stop-Fehler: '+(d.errors||[]).join(', '),
            d.success?'ok':'err');
}

async function createFolder(){
  const name=document.getElementById('newFolder').value.trim();
  if(!name){setStatus('Ordnername eingeben','err');return;}
  const d=await api('/api/folder/create',{method:'POST',body:JSON.stringify({name})});
  if(d.success){document.getElementById('newFolder').value='';setStatus('Ordner erstellt: '+name,'ok');await loadQuick();}
  else setStatus('Fehler: '+(d.error||''),'err');
}

// ---- Init ----
(async()=>{
  await loadSysStatus();
  await loadGongs();
  await loadQuick();
  await loadRecs();
  discoverSpeakers();
})();
</script>
</body>
</html>
